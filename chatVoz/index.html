<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stilos.css">
    <title>Chat de Voz con Texto a Voz</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.12.313/pdf.min.js"></script>
<script>
  // Configura el worker path
    pdfjsLib = window['pdfjs-dist/build/pdf'];
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.12.313/pdf.worker.min.js';
</script>
</head>
<body>
    <h1>Chat de Voz</h1>
    
    <div id="chat-container"></div>
    
    <div id="controls">
        <textarea id="text-input" placeholder="Escribe tu texto aquí..."></textarea>
        <button id="speak-text-btn">Leer Texto</button>
        <button id="start-listening-btn">Hablar</button>
        <button id="stop-listening-btn" disabled>Detener</button> 
        <input type="file" id="file-input" accept=".txt,.pdf">
        <label for="file-input" class="file-label">Cargar Archivo</label>
        <div id="web-content-controls">
    <input type="url" id="web-url" placeholder="https://ejemplo.com" style="width: 60%; padding: 8px;">
    <button id="fetch-web-content">Obtener Contenido</button>
    <div id="web-content-status" style="margin-top: 5px; color: #666; font-size: 0.9em;"></div>
</div>
    </div>

    <script src="script.js"></script>
    <script src="https://mozilla.github.io/pdf.js/build/pdf.js"></script>
</body>
</html>
